name: VISTORA Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "docs/**"
      - "reference/**"
      - "README.md"
      - ".github/workflows/vistora-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/**"
      - "reference/**"
      - "README.md"
      - ".github/workflows/vistora-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vistora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests and Android quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/**
            android/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Allow Gradle wrapper to execute
        run: chmod +x android/gradlew

      - name: Set up Android SDK API 37
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0'

      - name: Add Android 37 compatibility path for Gradle
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"

      - name: Assemble debug APK
        run: bash android/gradlew -p android :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: vistora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: bash android/gradlew -p android :app:testDebugUnitTest

      - name: Run Android lint
        run: bash android/gradlew -p android :app:lintDebug

      - name: Prepare optional release signing key
        env:
          VISTORA_KEYSTORE_BASE64: ${{ secrets.VISTORA_KEYSTORE_BASE64 }}
          VISTORA_KEYSTORE_PASSWORD: ${{ secrets.VISTORA_KEYSTORE_PASSWORD }}
          VISTORA_KEY_ALIAS: ${{ secrets.VISTORA_KEY_ALIAS }}
          VISTORA_KEY_PASSWORD: ${{ secrets.VISTORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${VISTORA_KEYSTORE_BASE64:-}" ]; then
            test -n "${VISTORA_KEYSTORE_PASSWORD:-}"
            test -n "${VISTORA_KEY_ALIAS:-}"
            test -n "${VISTORA_KEY_PASSWORD:-}"
            KEYSTORE="$RUNNER_TEMP/vistora-release.jks"
            printf '%s' "$VISTORA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "VISTORA_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "VISTORA_RELEASE_STORE_PASSWORD=$VISTORA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "VISTORA_RELEASE_KEY_ALIAS=$VISTORA_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "VISTORA_RELEASE_KEY_PASSWORD=$VISTORA_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing key prepared in the temporary runner directory."
          else
            echo "Release signing secrets are not configured; the release APK will be unsigned."
          fi

      - name: Assemble release APK
        run: bash android/gradlew -p android :app:assembleRelease

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: vistora-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM when available
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          else
            echo "KVM is unavailable; emulator software acceleration may be slower."
          fi

      - name: Run Room instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            bash android/gradlew -p android :app:connectedDebugAndroidTest
            mkdir -p "$RUNNER_TEMP/vistora-native-qa"
            for image in 01-home 02-library-empty 03-add-title 04-title-details 05-library-with-title 06-discover 07-stats 08-settings 09-my-notes; do
              adb exec-out run-as com.vistora.android cat "files/vistora-visual-qa/${image}.png" > "$RUNNER_TEMP/vistora-native-qa/${image}.png"
            done
            test "$(find "$RUNNER_TEMP/vistora-native-qa" -maxdepth 1 -name '*.png' | wc -l)" -eq 9

      - name: Upload VISTORA emulator screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vistora-native-screenshots
          path: ${{ runner.temp }}/vistora-native-qa/**/*.png
          if-no-files-found: warn
          retention-days: 14
